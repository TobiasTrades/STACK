<!DOCTYPE html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack — West Michigan Grocery Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17153B;--ink2:#4A4770;--muted:#5A5785;--bg:#F2F1FA;--card:#FFFFFF;--line:#E6E3F3;--accent:#4B2FE0;--accent-soft:#EEEAFF;--orange:#FF9A5C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 4px 14px;gap:12px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.8px}
.logo span{color:var(--accent)}
.home-btn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;font-weight:600;font-size:14px}
.home-btn svg{flex-shrink:0}
.hero{background:var(--accent);color:#fff;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.8px;opacity:.92}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.hero .sub{font-size:14px;opacity:.95}
.hero.dark{background:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.room{min-height:48px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 14px;text-align:left}
.room[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.room .n{font-weight:600;opacity:.75}
.chip .n{opacity:.7;font-weight:500;margin-left:4px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;min-height:48px}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;min-width:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:10px 4px 6px}
.sec h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px}
.sec .meta{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:22px;padding:4px 14px;box-shadow:0 1px 0 var(--line)}
.deal{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F0EEF8}
.deal:last-child{border-bottom:none}
.badge{flex-shrink:0;min-width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;padding:0 4px;text-align:center;line-height:1.05}
.deal .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.deal .nm{font-size:15px;font-weight:600}
.deal .st{font-size:12px;color:var(--muted)}
.price{font-size:15px;font-weight:800;text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cmp{font-size:12px;color:var(--ink2);display:block;margin-top:2px}.cm{white-space:nowrap}.cm.na,.cmp i.na{color:#9A97B8;font-style:normal}
.cmp b.up{color:#15803D;font-weight:700}.cmp b.dn{color:#B42318;font-weight:700}
.vd{font-size:11px;font-weight:800;display:block}.vd.ok{color:#15803D}.vd.no{color:#B42318}
.cpwhere{font-size:12px;color:var(--ink2);display:block;margin-top:2px}
.cpget{font-size:13px;font-weight:700;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.acc,.subacc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 16px;min-height:56px;color:var(--ink);font:inherit;margin-top:8px}
.acc .an{font-size:17px;font-weight:800;letter-spacing:-.3px}
.acc .am,.subacc .am{flex:1;text-align:right;font-size:12px;color:var(--muted)}
.chev{font-size:22px;line-height:1;color:var(--muted);transition:transform .15s}
.acc.open,.subacc.open{border-color:var(--accent)}.acc.open .chev,.subacc.open .chev{transform:rotate(90deg)}
.accbody{padding:0 0 4px 12px;border-left:2px solid var(--accent-soft);margin-left:8px}
.subacc{min-height:46px;padding:9px 14px;border-radius:14px;background:#FAFAFE}.subacc .an{font-size:15px;font-weight:700}
.linkbtn{background:none;border:none;color:var(--accent);font:inherit;font-size:13px;font-weight:700;min-height:36px;padding:0 4px}
.badge{position:relative;overflow:hidden}
.badge .logoimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:12%;box-sizing:border-box}
.itile{position:relative;flex-shrink:0;width:48px;height:48px;border-radius:14px;background:#F4F2FC;display:flex;align-items:center;justify-content:center}
.itile .emo{font-size:28px;line-height:1}
.itile .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:14px;padding:3px;box-sizing:border-box}
.itile .pimg + .emo{visibility:hidden}
.itile .mini{position:absolute;right:-5px;bottom:-5px;border:2px solid #fff;border-radius:8px;display:flex}
.itile .mini .badge{min-width:20px}
.itile .amt{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#5B3FE0;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;white-space:nowrap;border:2px solid #fff}
.price .was{font-size:12px;font-weight:600;color:var(--muted)}
.price .save{font-size:11px;font-weight:800;color:#15803D}
.add{flex-shrink:0;width:44px;height:44px;border-radius:14px;border:none;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.add[data-added="true"]{background:var(--accent);color:#fff}
.hero.win{background:#15803D}
.card.zero{border:2px solid #15803D}
.tier{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #F0EEF8;padding:12px 0;min-height:56px;color:var(--ink);font:inherit}
.tier .tb{font-size:16px;font-weight:800;min-width:96px}
.tier .tm{flex:1;display:flex;flex-direction:column;gap:2px}.tier .tm b{font-size:15px;color:#15803D}.tier .tm i{font-style:normal;font-size:12px;color:var(--muted)}
.tier .tx{font-size:13px;font-weight:800;background:#E3F4EA;color:#14532D;border-radius:999px;padding:4px 9px}
.tier.open{border-bottom:none}.tier.open .tb{color:var(--accent)}
.bi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #F6F5FB}.bi .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.bi .nm{font-size:14px;font-weight:600}.bi .st{font-size:12px;color:var(--muted)}
.ztot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.ztot div{background:#F2F1FA;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.ztot span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.ztot b{font-size:19px;font-weight:800;letter-spacing:-.5px}.ztot i{font-style:normal;font-size:11px;color:var(--muted)}
.xitem{padding:10px 0;border-bottom:1px solid #F0EEF8;display:flex;flex-direction:column;gap:4px}
.xh{display:flex;align-items:center;gap:8px}.xh b{font-size:15px}
.xnet{margin-left:auto;font-weight:800;font-size:15px}.xnet.pos{color:#15803D}
.pill.src{background:var(--accent-soft);color:var(--accent)}
.xs{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2)}.xs b{white-space:nowrap}
.xs.cp{color:#5B3FE0}.xs.rb{color:#15803D}
.xin{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.xin label{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
.xin input{width:72px;min-height:36px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:15px;background:#fff;color:var(--ink);color-scheme:light}
.xget{font-size:13px;font-weight:700;text-decoration:none;min-height:32px;display:flex;align-items:center}
.note{font-size:13px;color:var(--ink2);background:#FFF4E5;border-radius:14px;padding:10px 12px;line-height:1.4}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.tabbar nav{display:flex;gap:4px;background:var(--ink);border-radius:22px;padding:5px;width:100%;max-width:528px}
.tabbar button{flex:1;min-width:0;min-height:48px;padding:0 2px;white-space:nowrap;letter-spacing:-.2px;border:none;border-radius:17px;background:transparent;color:#CFCBEF;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.tabbar button[aria-current="page"]{background:#fff;color:var(--ink)}
.adder{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 14px}
.adder input{flex:1;border:none;outline:none;background:transparent;font-size:15px;min-width:0;min-height:40px}
.ibtn{width:44px;height:44px;border-radius:14px;border:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.ibtn.primary{background:var(--accent);color:#fff}
.ibtn.live{background:var(--orange);color:var(--ink)}
.li{padding:12px 0;border-bottom:1px solid #F0EEF8}
.li:last-child{border-bottom:none}
.li .top{display:flex;align-items:center;gap:12px}
.li label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:32px}
.li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;flex-shrink:0}
.li .t{font-size:15px;font-weight:600}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.rm{border:none;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.matches{display:flex;flex-direction:column;gap:4px;margin:6px 0 0 34px}
.m{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink2)}
.m b{color:var(--ink);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block;transform:translateY(1px)}
.nomatch{font-size:12px;color:var(--muted);margin:4px 0 0 34px}
.status{font-size:13px;color:var(--muted);padding:2px 4px}
.mapwrap{background:#E9E7F5;border-radius:24px;overflow:hidden;position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);padding:2px 4px}
.legend span{display:flex;align-items:center;gap:5px}
.range{display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:20px;padding:14px 16px}
.range label{font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.range input{width:100%;accent-color:var(--accent);min-height:32px}
.store{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #F0EEF8}
.store:last-child{border-bottom:none}
.store .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.store .nm{font-size:15px;font-weight:600}
.store .st{font-size:12px;color:var(--muted)}
.store a{font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;min-height:44px;display:flex;align-items:center}
.pill{font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px;white-space:nowrap}
.pill.ok{background:#E3F4EA;color:#14532D}
.pill.no{background:#F1F0F6;color:#4A4770}
dialog{border:none;border-radius:24px;padding:0;width:min(440px,92vw);color:var(--ink);box-shadow:0 30px 80px -20px rgba(23,21,59,.5)}
dialog::backdrop{background:rgba(23,21,59,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:20px}
.dlg select{min-height:48px;border-radius:14px;border:1px solid var(--line);padding:0 12px;background:#fff;font-size:15px}
.btn{min-height:48px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:0 18px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.sr{position:absolute;left:-9999px}
.bestrow{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid #F0EEF8}
.bestrow:last-child{border-bottom:none}
.bars{display:flex;gap:4px;height:8px}
.bars div{border-radius:4px}
</style>

<script>
/* Website adapter: gives the app the same db / dictation interface it has inside Claude.
   Deals, coupons and restaurants come from ./data/*.json (updated daily).
   The shopping list and favorites are saved on this device. */
(function(){
  window.STACK_WEB = true;
  var DATA = {"deals/current":"data/deals-current.json","deals/extra":"data/deals-extra.json","deals/sams":"data/deals-sams.json","deals/prices":"data/deals-prices.json","coupons/current":"data/coupons.json","eats/current":"data/eats.json"};
  function snap(data){ return {exists: data != null, data: function(){ return data; }, metadata: {fromCache: false}}; }
  function localDoc(path){
    var key = "stack.web." + path, subs = [];
    function read(){ try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
    return {
      onSnapshot: function(cb){ subs.push(cb); setTimeout(function(){ cb(snap(read())); }, 0); return function(){}; },
      set: function(data){ try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){} subs.forEach(function(cb){ cb(snap(JSON.parse(JSON.stringify(data)))); }); return Promise.resolve(); }
    };
  }
  var db = {
    doc: function(path){
      if (!DATA[path]) return localDoc(path);
      return {
        onSnapshot: function(cb, err){
          fetch(DATA[path] + "?v=" + Math.floor(Date.now() / 600000), {cache: "no-cache"})
            .then(function(r){ if (r.status === 404) return null; if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function(d){ cb(snap(d)); })
            .catch(function(e){ if (err) err(e); });
          return function(){};
        },
        set: function(){ return Promise.reject({code: "read_only"}); }
      };
    }
  };
  function dictation(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
    var rec = null, finals = [], states = [];
    function emit(s){ states.forEach(function(f){ f({state: s}); }); }
    return {
      onFinal: function(f){ finals.push(f); }, onState: function(f){ states.push(f); },
      start: function(){
        return new Promise(function(resolve, reject){
          try {
            rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.continuous = false;
            rec.onresult = function(e){ var t = ""; for (var i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) t += e.results[i][0].transcript; if (t) finals.forEach(function(f){ f({text: t}); }); };
            rec.onerror = function(e){ emit("idle"); if (e.error === "not-allowed") reject({code: "not_granted"}); };
            rec.onend = function(){ emit("idle"); };
            rec.onstart = function(){ emit("listening"); resolve(); };
            rec.start();
          } catch(e){ reject(e); }
        });
      },
      stop: function(){ try { rec && rec.stop(); } catch(e){} return Promise.resolve(); }
    };
  }
  window.claude = {use: function(name){
    if (name === "db") return Promise.resolve(db);
    if (name === "dictation") return Promise.resolve(dictation());
    return Promise.reject({code: "unavailable"});
  }};
})();

</script>

var MODIFIED = {};
["noodle","nog","roll","salad","dip","chip","crust","mix","juice","cider","filling","bark","flour","butter","pie","cake","cookie","bar","spread","dressing","sauce","slaw","paste","soup","oil","topping","cup","mate","creamer","bread","treat","tea","flake","stock","broth","seasoning","candy"].forEach(function(w){ MODIFIED[stem(w)] = 1; MODIFIED[stem(w+"s")] = 1; });

/* ---------- Coupons ---------- */
function liveCoupons(){
  if (!state.coupons) return [];
  var iso = todayISO();
  return state.coupons.items.filter(function(c){ return !c.exp || c.exp >= iso; });
}
function matchCoupons(text){
  var tk = tokens(text); if (!tk.length) return [];
  return liveCoupons().filter(function(c){
    var ct = tokens(c.b + " " + c.n);
    return tk.every(function(w){ return ct.some(function(x, idx){
      if (!(x === w || (w.length >= 4 && x.indexOf(w) === 0))) return false;
      var nxt = ct[idx+1]; return !(nxt && MODIFIED[nxt] && tk.indexOf(nxt) < 0);
    }); });
  });
}
function cpTypeKey(c){ return c.t.split(" ·")[0]; }
function expLabel(c){
  if (!c.exp) return "Print now · expiration on coupon";
  var days = Math.round((new Date(c.exp+"T12:00:00") - new Date(todayISO()+"T12:00:00"))/86400000);
  return days <= 0 ? "Expires today" : days === 1 ? "Expires tomorrow" : "Expires " + fmtDate(c.exp) + (days <= 3 ? " — soon" : "");
}
/* the best real shelf price we know for what a coupon covers, and what it costs after the coupon */
var CP_PRICE = new WeakMap(), cpPriceKey = null;
function couponPrice(c){
  var key = (state.deals ? state.deals.items.length : 0) + "|" + (state.prices ? state.prices.items.length : 0) + "|" + state.radius + "|" + state.homeId;
  if (key !== cpPriceKey){ CP_PRICE = new WeakMap(); cpPriceKey = key; }
  if (CP_PRICE.has(c)) return CP_PRICE.get(c);
  var pool = (state.deals ? state.deals.items : []).concat(state.prices ? state.prices.items : []), inRange = chainsInRange(), v = cpValue(c), best = null;
  pool.forEach(function(d){
    if (!inRange[d.s] || !dealLiveToday(d) || /out of stock/i.test(d.x || "")) return;
    var pr = shelfPrice(d); if (pr == null || pr <= 0 || !cpFitsDeal(c, d) || !cpScore(c, d)) return;
    var qty = v.qty, cost = pr * qty, face = v.bogo ? Math.min(pr, v.cap || pr) : v.lo, off = Math.min(face, cost), after = cost - off;
    if (!best || after < best.after) best = {d:d, qty:qty, cost:cost, off:off, after:after, capped: face > cost + 0.004};
  });
  CP_PRICE.set(c, best); return best;
}
function couponRow(c){

  var right;
  if (pp){
    right = '<span class="price cpp"><s class="was">'+money(pp.cost)+'</s>'+(pp.after <= 0.005 ? '<span style="color:#15803D">FREE</span>' : money(pp.after))+'<span class="save">−'+money(pp.off)+' coupon</span></span>';
  } else {
    right = '<span class="price cpp"><span class="save" style="font-size:13px">'+esc(offText)+'</span><span class="was" style="text-decoration:none;font-size:11px">price not found yet</span></span>';
  }
  var where = pp ? '<span class="cpwhere">'+esc(pp.d.s)+': '+esc(pp.d.n)+(pp.qty>1?' ×'+pp.qty:'')+' · '+(pp.d.r?'shelf price':'sale price')+(!parseSize(pp.d.n) && cpSizes(c).length ? ' · check the size on the coupon' : '')+(v.hi > v.lo ? ' · counted at '+money(v.lo)+', up to '+money(v.hi)+' on bigger sizes' : '')+(pp.capped ? ' · coupon stops at the price' : '')+'</span>' : '';
  var cpi = productImg(c.b + " " + c.n) || (couponPrice(c) && productImg(couponPrice(c).d.n));

/* ---------- Favorites ---------- */
var favRef = null, favWriting = false, favPending = false;
function starSvg(on){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="'+(on?'#FF9A5C':'none')+'" stroke="'+(on?'#C2410C':'currentColor')+'" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>'; }
function isFav(t){ var k = String(t).toLowerCase(); return state.favs.items.some(function(f){ return f.t.toLowerCase() === k; }); }
function placeKey(p){ return p.n + " | " + p.t; }
function isFavPlace(p){ return state.favs.places.indexOf(placeKey(p)) >= 0; }
function toggleFav(t){
  if (isFav(t)) state.favs.items = state.favs.items.filter(function(f){ return f.t.toLowerCase() !== String(t).toLowerCase(); });
  else state.favs.items.push({id: uid(), t: t.charAt(0).toUpperCase() + t.slice(1)});
  saveFavs(); render();
}
function toggleFavPlace(k){
  var i = state.favs.places.indexOf(k);
  if (i >= 0) state.favs.places.splice(i,1); else state.favs.places.push(k);
  saveFavs(); render();
}
function saveFavs(){
  if (state.favMode !== "shared" || !favRef){ lsSet("stack.favs", state.favs); return; }
  if (favWriting){ favPending = true; return; }
  favWriting = true;
  favRef.set({items: state.favs.items, places: state.favs.places, updated: new Date().toISOString()}).catch(function(err){
    if (err && err.code === "invalid_argument"){ state.favMode = "local"; toast("Saving favorites on this device only"); }
    lsSet("stack.favs", state.favs);
  }).then(function(){ favWriting = false; if (favPending){ favPending = false; saveFavs(); } });
}
function dealKey(d){ return d.s + "|" + d.n + "|" + d.p; }
var seenDeals = lsGet("stack.seenFavDeals", {});
function favMatches(){
  return state.favs.items.map(function(f){ return {f: f, ms: matchDeals(f.t)}; });
}
var QUICK = ["Chicken breast","Ground beef","Bacon","Eggs","Milk","Butter","Cheese","Bread","Coffee","Bananas","Apples","Potatoes","Cereal","Pasta","Paper towels","Laundry detergent","Ice cream","Pizza"];
function viewFaves(){
  var fm = favMatches(), onSale = fm.filter(function(x){ return x.ms.length; });
  var newCount = 0; onSale.forEach(function(x){ x.ms.forEach(function(d){ if (!seenDeals[dealKey(d)]) newCount++; }); });
  var favPlaces = (state.eats ? state.eats.places : []).filter(isFavPlace);
  var placeSp = favPlaces.filter(function(p){ return specialsNow(p).length; });
  var h = '<div class="stack">';
  h += '<div class="hero"><span class="k">YOUR FAVORITES</span>'
     + '<span class="big">'+onSale.length+' of '+state.favs.items.length+' on sale</span>'
     + '<span class="sub">'+(function(){ var n = state.favs.items.filter(function(f){ return matchCoupons(f.t).length; }).length; return n ? n+' with coupons · ' : ''; })()+(newCount ? newCount+' new deal'+(newCount===1?'':'s')+' since you last looked' : 'Nothing new since you last looked')+(placeSp.length ? ' · '+placeSp.length+' favorite restaurant'+(placeSp.length===1?'':'s')+' with specials today' : '')+'</span></div>';
  h += '<form class="adder" id="favForm"><label for="favItem" class="sr">Add a favorite</label><input id="favItem" placeholder="Add something you buy often — e.g. Folgers, chicken breast" autocomplete="off">'
     + '<button type="submit" class="ibtn primary" aria-label="Add favorite">'+starSvg(false).replace('stroke="currentColor"','stroke="#fff"')+'</button></form>';
  var quick = QUICK.filter(function(q){ return !isFav(q); });
  if (quick.length){
    h += '<div class="chips" role="group" aria-label="Quick add favorites">';
    quick.forEach(function(q){ h += '<button type="button" class="chip" data-quickfav="'+esc(q)+'">+ '+esc(q)+'</button>'; });
    h += '</div>';
  }
  h += '<div class="status">'+(state.favMode==="shared"?'Shared with everyone who uses this app. ':'Saved on this device only. ')+'Each morning the app checks every store\'s new ads and sends you a notification when a favorite goes on sale.</div>';
  if (!state.favs.items.length && !favPlaces.length){
    h += '<div class="empty">No favorites yet. Add the things you buy every week, tap ☆ on any shopping-list item, or star a restaurant in Eat.</div>';
  }
  if (state.favs.items.length){
    var sorted = fm.slice().sort(function(a,b){ return ((b.ms.length||matchCoupons(b.f.t).length)?1:0) - ((a.ms.length||matchCoupons(a.f.t).length)?1:0); });
    h += '<div class="sec"><h2>Groceries</h2><span class="meta">'+onSale.length+' on sale now</span></div><div class="card">';
    sorted.forEach(function(x){
      h += '<div class="li"><div class="top"><span style="flex:1" class="t">'+esc(x.f.t)+'</span>'
         + (x.ms.length && !onList(x.f.t) ? '<button type="button" class="chip" data-favtolist="'+esc(x.f.t)+'" style="min-height:36px">Add to list</button>' : '')
         + '<button type="button" class="rm" data-favtoggle="'+esc(x.f.t)+'" aria-label="Remove from favorites: '+esc(x.f.t)+'">'+starSvg(true)+'</button></div>';
      if (x.ms.length){
        h += '<div class="matches" style="margin-left:0">';
        x.ms.slice(0,4).forEach(function(d){ var isNew = !seenDeals[dealKey(d)];
          h += '<div class="m"><span class="dot" style="background:'+(CHAINS[d.s]||{}).color+'"></span><span>'+esc(d.s)+': '+esc(d.n)+(d.x?' ('+esc(d.x)+')':'')+'</span><b>'+esc(d.p)+'</b>'+(isNew?' <span class="pill" style="background:#FFE9DB;color:#7C2D12">NEW</span>':'')+'</div>'; });
        if (x.ms.length > 4) h += '<div class="m" style="color:var(--muted)">+'+(x.ms.length-4)+' more</div>';
        h += '</div>';
      } else h += '<div class="nomatch" style="margin-left:0">Not on sale this week — we\'ll keep watching</div>';
      var fc = matchCoupons(x.f.t);
      if (fc.length){ h += '<div class="matches" style="margin-left:0">'; fc.slice(0,3).forEach(function(c){ h += '<div class="m"><span class="dot" style="background:#5B3FE0"></span><span>Coupon: '+esc(c.b)+' — '+esc(c.n)+' · '+esc(expLabel(c))+' · <a href="'+esc(c.u)+'" target="_blank" rel="noopener">get it</a></span><b>'+esc(c.v)+'</b></div>'; }); if (fc.length>3) h += '<div class="m" style="color:var(--muted)">+'+(fc.length-3)+' more coupons</div>'; h += '</div>'; }
      h += '</div>';
    });
    h += '</div>';
    if (onSale.some(function(x){ return !onList(x.f.t); })) h += '<button type="button" class="btn" id="favAllToList">Add all on-sale favorites to my list</button>';
  }
  if (favPlaces.length){
    h += '<div class="sec"><h2>Restaurants</h2><span class="meta">'+placeSp.length+' with specials today</span></div><div class="card">';
    favPlaces.forEach(function(p){ var sp = specialsNow(p);
      h += '<div class="store" style="align-items:flex-start"><div class="mid"><span class="nm">'+esc(p.n)+'</span><span class="st">'+esc(p.a)+'</span>';
      if (sp.length) sp.forEach(function(s){ h += '<span class="m" style="margin-top:4px"><span class="pill ok">'+esc(s.when)+'</span> '+esc(s.t)+'</span>'; });
      else h += '<span class="st">No special posted today</span>';
      h += '</div><button type="button" class="rm" data-favplace="'+esc(placeKey(p))+'" aria-label="Remove from favorites: '+esc(p.n)+'">'+starSvg(true)+'</button></div>'; });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function markFavsSeen(){
  var changed = false;
  favMatches().forEach(function(x){ x.ms.forEach(function(d){ var k = dealKey(d); if (!seenDeals[k]){ seenDeals[k] = Date.now(); changed = true; } }); });
  if (changed) lsSet("stack.seenFavDeals", seenDeals);
}

/* ---------- Events ---------- */
function bindView(){
  var v = document.getElementById("view");
  var q = document.getElementById("q");
  if (q){ q.addEventListener("input", function(){ state.q = q.value; var pos = q.selectionStart; render(); var q2 = document.getElementById("q"); if (q2){ q2.focus(); try{ q2.setSelectionRange(pos,pos); }catch(e){} } }); }
  v.querySelectorAll("[data-chain]").forEach(function(b){ b.addEventListener("click", function(){ state.chain = b.dataset.chain; render(); }); });
  v.querySelectorAll("[data-cat]").forEach(function(b){ b.addEventListener("click", function(){ state.cat = b.dataset.cat; render(); }); });
  v.querySelectorAll("[data-add]").forEach(function(b){ b.addEventListener("click", function(){
    var name = b.dataset.add;
    if (onList(name)){ toast("Already on your list"); return; }
    addItems([name]); toast("Added to your list");
  }); });
  var f = document.getElementById("addForm");
  if (f){ f.addEventListener("submit", function(e){ e.preventDefault(); var inp = document.getElementById("newItem"); var parts = splitItems(inp.value); if (parts.length){ addItems(parts); } inp.value = ""; }); }
  var mic = document.getElementById("micBtn"); if (mic) mic.addEventListener("click", toggleMic);
  var ph = document.getElementById("photoBtn"); if (ph) ph.addEventListener("click", function(){ if (!state.photoBusy) document.getElementById("photoIn").click(); });
  v.querySelectorAll("[data-toggle]").forEach(function(c){ c.addEventListener("change", function(){ var id = c.dataset.toggle; state.list = state.list.map(function(i){ return i.id===id ? Object.assign({}, i, {done: c.checked}) : i; }); saveList(); render(); }); });
  v.querySelectorAll("[data-rm]").forEach(function(b){ b.addEventListener("click", function(){ var id = b.dataset.rm; state.list = state.list.filter(function(i){ return i.id !== id; }); saveList(); render(); }); });
  var cd = document.getElementById("clearDone"); if (cd) cd.addEventListener("click", function(){ state.list = state.list.filter(function(i){ return !i.done; }); saveList(); render(); });
  v.querySelectorAll("[data-ecat]").forEach(function(b){ b.addEventListener("click", function(){ state.eatCat = b.dataset.ecat; render(); }); });
  var et = document.getElementById("eatToday"); if (et) et.addEventListener("change", function(){ state.eatToday = et.checked; render(); });
  v.querySelectorAll("[data-favtoggle]").forEach(function(b){ b.addEventListener("click", function(){ toggleFav(b.dataset.favtoggle); }); });
  v.querySelectorAll("[data-favplace]").forEach(function(b){ b.addEventListener("click", function(){ toggleFavPlace(b.dataset.favplace); }); });
  v.querySelectorAll("[data-quickfav]").forEach(function(b){ b.addEventListener("click", function(){ toggleFav(b.dataset.quickfav); }); });
  v.querySelectorAll("[data-favtolist]").forEach(function(b){ b.addEventListener("click", function(){ addItems([b.dataset.favtolist]); toast("Added to your list"); }); });
  var fa = document.getElementById("favAllToList"); if (fa) fa.addEventListener("click", function(){ var names = favMatches().filter(function(x){ return x.ms.length && !onList(x.f.t); }).map(function(x){ return x.f.t; }); addItems(names); toast("Added " + names.length + " to your list"); });
  var ff = document.getElementById("favForm"); if (ff) ff.addEventListener("submit", function(e){ e.preventDefault(); var inp = document.getElementById("favItem"); splitItems(inp.value).forEach(function(t){ if (!isFav(t)) state.favs.items.push({id: uid(), t: t.charAt(0).toUpperCase()+t.slice(1)}); }); inp.value = ""; saveFavs(); render(); });
  if (state.tab === "faves" && state.deals){ clearTimeout(window.__seenT); window.__seenT = setTimeout(markFavsSeen, 4000); }
  v.querySelectorAll("[data-prim]").forEach(function(b){ b.addEventListener("click", function(){ var c = b.dataset.prim, i = state.primary.indexOf(c); if (i >= 0) state.primary.splice(i,1); else state.primary.push(c); lsSet("stack.primary2", state.primary); render(); }); });
  v.querySelectorAll("[data-acc]").forEach(function(b){ b.addEventListener("click", function(){ var k = b.dataset.acc; state.openCats[k] = !state.openCats[k]; lsSet("stack.openCats", state.openCats); var y = window.scrollY; render(); window.scrollTo(0, y); }); });
  v.querySelectorAll("[data-subacc]").forEach(function(b){ b.addEventListener("click", function(){ var k = b.dataset.subacc; state.openSubs[k] = !state.openSubs[k]; lsSet("stack.openSubs", state.openSubs); var y = window.scrollY; render(); window.scrollTo(0, y); }); });
  v.querySelectorAll("[data-openall]").forEach(function(b){ b.addEventListener("click", function(){ var on = b.dataset.openall === "1"; state.openCats = {}; state.openSubs = {};
    if (on) CATS.forEach(function(c){ state.openCats[c.id] = true; (SUBCATS[c.id] || []).concat([{id:"other"}]).forEach(function(s){ state.openSubs[c.id + "/" + s.id] = true; }); });
    lsSet("stack.openCats", state.openCats); lsSet("stack.openSubs", state.openSubs); render(); }); });
  v.querySelectorAll("[data-sort]").forEach(function(b){ b.addEventListener("click", function(){ state.sort = b.dataset.sort; lsSet("stack.sort", state.sort); render(); }); });
  v.querySelectorAll("[data-dmode]").forEach(function(b){ b.addEventListener("click", function(){ state.dealMode = b.dataset.dmode; render(); }); });
  v.querySelectorAll("[data-xscope]").forEach(function(b){ b.addEventListener("click", function(){ state.xScope[b.dataset.xscope] = !state.xScope[b.dataset.xscope]; lsSet("stack.xscope", state.xScope); render(); }); });
  v.querySelectorAll("[data-xrebate],[data-xprice]").forEach(function(inp){ inp.addEventListener("change", function(){
    var k = inp.dataset.xrebate || inp.dataset.xprice, f = inp.dataset.xrebate ? "rebate" : "price";
    var val = inp.value.replace(/[^\d.]/g,""); xtra[k] = xtra[k] || {}; if (val) xtra[k][f] = val; else delete xtra[k][f];
    lsSet("stack.xtra", xtra); var y = window.scrollY; render(); window.scrollTo(0, y); }); });
  v.querySelectorAll("[data-zb]").forEach(function(b){ b.addEventListener("click", function(){ state.zeroBudget = parseInt(b.dataset.zb,10); lsSet("stack.zb", state.zeroBudget); render(); }); });
  v.querySelectorAll("[data-tier]").forEach(function(b){ b.addEventListener("click", function(){ var t = parseInt(b.dataset.tier,10); state.budgetOpen = state.budgetOpen === t ? null : t; var y = window.scrollY; render(); window.scrollTo(0, y); }); });
  v.querySelectorAll("[data-tieradd]").forEach(function(b){ b.addEventListener("click", function(){ var n = JSON.parse(b.dataset.tieradd); addItems(n); toast("Added " + n.length + " to your list"); render(); }); });
  var za = document.getElementById("zeroAdd"); if (za) za.addEventListener("click", function(){ var n = JSON.parse(za.dataset.names); addItems(n); toast("Added " + n.length + " free items"); });
  var xg = document.getElementById("xGo"); if (xg) xg.addEventListener("click", function(){ state.tab = "deals"; state.dealMode = "extreme"; state.xScope.list = true; render(); window.scrollTo(0,0); });
  v.querySelectorAll("[data-cproom]").forEach(function(b){ b.addEventListener("click", function(){ state.cpRoom = b.dataset.cproom; state.cpSub = "all"; state.cpType = "all"; render(); }); });
  v.querySelectorAll("[data-cpsub]").forEach(function(b){ b.addEventListener("click", function(){ state.cpSub = b.dataset.cpsub; render(); }); });
  v.querySelectorAll("[data-cptype]").forEach(function(b){ b.addEventListener("click", function(){ state.cpType = b.dataset.cptype; render(); }); });
  var cq = document.getElementById("cpq"); if (cq) cq.addEventListener("input", function(){ state.cpQ = cq.value; var pos = cq.selectionStart; render(); var c2 = document.getElementById("cpq"); if (c2){ c2.focus(); try{ c2.setSelectionRange(pos,pos); }catch(e){} } });
  var rm = document.getElementById("radMap");
  if (rm){ rm.addEventListener("input", function(){ state.radius = parseInt(rm.value,10); lsSet("stack.radius", state.radius); render(); var r2 = document.getElementById("radMap"); if (r2) r2.focus(); }); }
}

document.querySelectorAll(".tabbar button").forEach(function(b){
  b.addEventListener("click", function(){ state.tab = b.dataset.tab; try{ history.replaceState(null, "", "#"+state.tab); }catch(e){} render(); window.scrollTo(0,0); });
});
window.addEventListener("hashchange", function(){ var h = location.hash.replace("#",""); if (["deals","list","budget","faves","eat","map","stores"].indexOf(h) >= 0 && h !== state.tab){ state.tab = h; render(); } });

/* ---------- Shopping list storage ---------- */
var db = null, listRef = null, writing = false, pendingWrite = false;
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function splitItems(s){ return String(s||"").split(/,|;|\n|\band\b|\bthen\b/i).map(function(x){ return x.replace(/^\s*(some|a|an)\s+/i,"").trim().replace(/[.!?]+$/,""); }).filter(function(x){ return x.length > 1; }); }
function addItems(names){
  names.forEach(function(n){ var t = n.charAt(0).toUpperCase() + n.slice(1); if (!onList(t)) state.list.push({id: uid(), t: t, done: false}); });
  saveList(); render();
}
function saveList(){
  if (state.listMode !== "shared" || !listRef){ lsSet("stack.list", state.list); return; }
  if (writing){ pendingWrite = true; return; }
  writing = true;
  listRef.set({items: state.list, updated: new Date().toISOString()}).catch(function(err){
    if (err && err.code === "invalid_argument"){ state.listMode = "local"; toast("You can view but not edit the shared list — saving on this device"); }
    else if (err && err.code === "quota_exceeded"){ toast("The shared list is full — remove some items"); }
    lsSet("stack.list", state.list);
  }).then(function(){ writing = false; if (pendingWrite){ pendingWrite = false; saveList(); } });
}
state.list = lsGet("stack.list", []);
state.favs = lsGet("stack.favs", {items: [], places: []});

/* ---------- Voice ---------- */
var dictation = null;
function toggleMic(){
  if (!dictation) return;
  if (state.listening){ dictation.stop().catch(function(){}); return; }
  dictation.start().catch(function(err){
    state.listening = false; render();
    if (err && err.code === "not_granted"){ dictation = null; toast("Microphone not allowed — you can still type"); render(); }
    else toast("Couldn't start listening");
  });
}

/* ---------- Photo ---------- */
var sample = null;
document.getElementById("photoIn").addEventListener("change", function(e){
  var file = e.target.files && e.target.files[0]; e.target.value = "";
  if (!file) return;
  if (!sample){ toast("Photo reading isn't available in this view"); return; }
  state.photoBusy = true; render(); toast("Reading your photo…");
  var prompt = "You are reading a photo for a grocery shopping-list app. The photo may be a handwritten or printed shopping list, a recipe, a receipt, a product package, or the inside of a fridge or pantry. " +
    "Return the grocery items the person should add to their shopping list, as short generic names a shopper would search a weekly ad for (e.g. 'chicken breast', 'cheddar cheese', 'bananas'). " +
    "For a product package return that product. For a fridge or pantry, return only items that look empty or nearly empty; if none, return an empty list. " +
    "Respond with JSON only: {\"items\": [\"...\"]}. At most 30 items.";
  Promise.resolve().then(function(){ return sample.limits ? sample.limits() : {images:true}; }).then(function(lim){
    if (!lim || !lim.images){ throw {code:"no_images"}; }
    return sample.json(prompt, {images:[file], modelTier:"default"});
  }).then(function(res){
    var items = (res && res.items) || [];
    items = items.filter(function(x){ return typeof x === "string" && x.trim(); }).map(function(x){ return x.trim(); });
    if (items.length){ addItems(items); toast("Added " + items.length + " item" + (items.length===1?"":"s") + " from your photo"); }
    else toast("Didn't find any grocery items in that photo");
  }).catch(function(err){
    var c = err && err.code;
    if (c === "not_granted") toast("Photo reading wasn't allowed");
    else if (c === "rate_limited") toast("Too many photos at once — try again in a minute");
    else if (c === "no_images") toast("Photo reading isn't available here");
    else toast("Couldn't read that photo");
  }).then(function(){ state.photoBusy = false; render(); });
});

/* ---------- Capabilities ---------- */
render();
var dealsTimer = setTimeout(function(){ if (state.dealsStatus === "loading") state.dealsStatus = "unavailable"; if (state.eatsStatus === "loading") state.eatsStatus = "unavailable"; if (state.couponsStatus === "loading") state.couponsStatus = "unavailable"; render(); }, 10000);

if (window.STACK_WEB){
  fetch("data/images.json?v=" + Math.floor(Date.now() / 3600000)).then(function(r){ return r.ok ? r.json() : {}; }).then(function(m){
    Object.keys(m.images || {}).forEach(function(k){ if (m.images[k]) IMG[k] = m.images[k]; }); renderSoon();
  }).catch(function(){});
}
if (window.claude && window.claude.use){
  window.claude.use("db").then(function(d){
    db = d;
    if (!db){ clearTimeout(dealsTimer); state.dealsStatus = "unavailable"; state.eatsStatus = "unavailable"; render(); return; }
    var dealParts = {main: null, extra: null, sams: null};
    function combineDeals(){
      var parts = [dealParts.main, dealParts.extra, dealParts.sams].filter(Boolean);
      if (!parts.length) return;
      var chains = {}, items = [], later = {};
      /* a chain in a later document replaces that chain's items from earlier ones */
      parts.forEach(function(pt, i){ (pt.items || []).forEach(function(it){ later[it.s] = i; }); });
      parts.forEach(function(pt, i){ Object.assign(chains, pt.chains || {}); (pt.items || []).forEach(function(it){ if (later[it.s] === i) items.push(it); }); });
      state.deals = {updated: (dealParts.main || parts[0]).updated, chains: chains, items: items}; state.dealsStatus = "ready";
    }
    db.doc("deals/current").onSnapshot(function(snap){
      clearTimeout(dealsTimer);
      if (snap.exists){ dealParts.main = snap.data(); combineDeals(); }
      else if (!snap.metadata.fromCache && !dealParts.extra){ state.dealsStatus = "unavailable"; }
      render();
    }, function(){ clearTimeout(dealsTimer); state.dealsStatus = state.deals ? "ready" : "unavailable"; render(); });
    db.doc("deals/extra").onSnapshot(function(snap){ dealParts.extra = snap.exists ? snap.data() : null; combineDeals(); renderSoon(); }, function(){});
    db.doc("deals/prices").onSnapshot(function(snap){ state.prices = snap.exists ? snap.data() : null; renderSoon(); }, function(){});
    db.doc("deals/sams").onSnapshot(function(snap){ dealParts.sams = snap.exists ? snap.data() : null; combineDeals(); renderSoon(); }, function(){});

    db.doc("eats/current").onSnapshot(function(snap){
      if (snap.exists){ var e = snap.data(); state.eats = {updated: e.updated, note: e.note, places: e.places || []}; state.eatsStatus = "ready"; }
      else if (!snap.metadata.fromCache){ state.eatsStatus = "unavailable"; }
      render();
    }, function(){ state.eatsStatus = state.eats ? "ready" : "unavailable"; render(); });

    db.doc("coupons/current").onSnapshot(function(snap){
      if (snap.exists){ var c = snap.data(); state.coupons = {updated: c.updated, note: c.note, items: c.items || []}; state.couponsStatus = "ready"; }
      else if (!snap.metadata.fromCache){ state.couponsStatus = "unavailable"; }
      render();
    }, function(){ state.couponsStatus = state.coupons ? "ready" : "unavailable"; render(); });

    favRef = db.doc("favorites/household");
    var favFirst = true;
    favRef.onSnapshot(function(snap){
      var local = lsGet("stack.favs", {items: [], places: []});
      state.favMode = "shared";
      var remote = snap.exists ? {items: (snap.data().items || []).map(function(f){ return {id: f.id, t: f.t}; }), places: (snap.data().places || []).slice()} : {items: [], places: []};
      if (favFirst && !snap.metadata.fromCache && (local.items.length || local.places.length)){
        var have = {}; remote.items.forEach(function(f){ have[f.t.toLowerCase()] = 1; });
        local.items.forEach(function(f){ if (!have[f.t.toLowerCase()]) remote.items.push(f); });
        local.places.forEach(function(k){ if (remote.places.indexOf(k) < 0) remote.places.push(k); });
        state.favs = remote; saveFavs(); lsSet("stack.favs", {items: [], places: []});
      } else state.favs = remote;
      if (!snap.metadata.fromCache) favFirst = false;
      render();
    }, function(){ state.favMode = "local"; render(); });

    listRef = db.doc("lists/household");
    var first = true;
    listRef.onSnapshot(function(snap){
      var local = lsGet("stack.list", []);
      state.listMode = "shared";
      if (snap.exists){
        var items = (snap.data().items || []).map(function(i){ return {id:i.id, t:i.t, done:!!i.done}; });
        if (first && !snap.metadata.fromCache && local.length){
          var ids = {}; items.forEach(function(i){ ids[i.t.toLowerCase()] = 1; });
          var extra = local.filter(function(i){ return !ids[i.t.toLowerCase()]; });
          state.list = items.concat(extra);
          if (extra.length) saveList();
          lsSet("stack.list", []);
        } else { state.list = items; }
      } else if (first && !snap.metadata.fromCache && local.length){
        state.list = local; saveList(); lsSet("stack.list", []);
      }
      if (!snap.metadata.fromCache) first = false;
      render();
    }, function(){ state.listMode = "local"; state.list = lsGet("stack.list", state.list); render(); });
  }).catch(function(){ clearTimeout(dealsTimer); state.dealsStatus = "unavailable"; render(); });

  window.claude.use("dictation").then(function(d){
    dictation = d;
    if (!d){ render(); return; }
    d.onFinal(function(r){ var items = splitItems(r && r.text); if (items.length){ addItems(items); toast("Added: " + items.join(", ")); } });
    d.onState(function(s){ state.listening = s && s.state === "listening"; render(); });
    render();
  }).catch(function(){});

  window.claude.use("sample").then(function(s){ sample = s; render(); }).catch(function(){});
} else {
  clearTimeout(dealsTimer); state.dealsStatus = "unavailable"; render();
}
})();
</script>
</body>
</html>
