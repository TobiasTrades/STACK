name: Product photos
on:
  schedule:
    - cron: "23 13 * * *"     # daily, after the morning deal update
  push:
    paths: ["data/deals-*.json", "data/coupons.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: product-photos
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_images.py
      - name: Save photos
        run: |
          git config user.name "stack-bot"
          git config user.email "stack-bot@users.noreply.github.com"
          git add data/images.json
          git diff --cached --quiet || (git commit -m "Update product photos" && git pull --rebase && git push)
