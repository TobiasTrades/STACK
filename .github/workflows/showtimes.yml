name: Movie showtimes
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: movie-showtimes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch nearby showtimes
        env:
          API_CINEMA_KEY: ${{ secrets.API_CINEMA_KEY }}
        run: python scripts/fetch_showtimes.py
      - name: Save showtimes cache
        run: |
          git config user.name "stack-bot"
          git config user.email "stack-bot@users.noreply.github.com"
          git add data/showtimes.json
          git diff --cached --quiet || (git commit -m "Refresh nearby movie showtimes" && git pull --rebase && git push)
